[workspace]
resolver = "3"
members = [
    "logmancer-tui",
    "logmancer-core",
    "logmancer-web",
    "logmancer-desktop"
]

# Keep local builds and tests debuggable without retaining full dependency symbols.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Size-optimized profile for the Leptos WASM bundle.
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
