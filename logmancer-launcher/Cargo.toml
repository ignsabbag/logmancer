[package]
name = "logmancer-launcher"
version = "0.4.1"
edition = "2024"

[[bin]]
name = "logmancer"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
