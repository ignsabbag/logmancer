name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    uses: ./.github/workflows/package-linux.yml
    with:
      source_ref: ${{ github.sha }}
      release_tag: ${{ github.ref_name }}
  windows:
    uses: ./.github/workflows/package-windows.yml
    with:
      source_ref: ${{ github.sha }}
      release_tag: ${{ github.ref_name }}
  arch:
    uses: ./.github/workflows/package-arch.yml
    with:
      source_ref: ${{ github.sha }}
      release_tag: ${{ github.ref_name }}

  publish:
    name: Publish GitHub release
    needs: [linux, windows, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          pattern: logmancer-*
          path: dist
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            release_flags+=(--prerelease)
          fi
          assets=(dist/*.zip dist/*.deb dist/*.exe dist/*.pkg.tar.zst)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
            if ((${#release_flags[@]})); then
              gh release edit "$TAG_NAME" "${release_flags[@]}"
            fi
          else
            gh release create "$TAG_NAME" "${assets[@]}" --title "$TAG_NAME" --generate-notes "${release_flags[@]}"
          fi
