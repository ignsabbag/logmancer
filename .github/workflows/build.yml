name: Build

on:
  workflow_run:
    workflows: ["Test"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to package
        type: choice
        default: all
        options: [all, linux, windows, arch]

concurrency:
  group: build-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/test.yml
    with:
      source_ref: ${{ github.sha }}

  prepare:
    needs: tests
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'workflow_dispatch' && needs.tests.result == 'success') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.source.outputs.ref }}
    steps:
      - id: source
        env:
          SOURCE_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"

  linux:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux') }}
    uses: ./.github/workflows/package-linux.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_ref }}

  windows:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows') }}
    uses: ./.github/workflows/package-windows.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_ref }}

  arch:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'arch') }}
    uses: ./.github/workflows/package-arch.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_ref }}

  cleanup-artifacts:
    name: Keep only latest automatic main artifacts
    needs: [linux, windows, arch]
    if: github.event_name == 'workflow_run' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'build.yml', branch: 'main', event: 'workflow_run', per_page: 100
            });
            const currentRun = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: context.runId });
            for (const run of runs) {
              if (run.id === context.runId || run.run_number >= currentRun.data.run_number || run.status !== 'completed') continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner, repo, run_id: run.id, per_page: 100
              });
              for (const artifact of artifacts) {
                if (!/^logmancer-(package|installer|binaries|tui)-/.test(artifact.name)) continue;
                core.info(`Deleting ${artifact.name} from automatic run ${run.id}`);
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              }
            }
